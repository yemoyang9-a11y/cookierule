name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests + network lint
        run: |
          npm test
          npm run lint:network
      - name: Install Playwright (Chromium)
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Smoke test (real Chromium)
        run: npm run test:e2e
      - name: Build zips (chrome, edge, firefox)
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: cookierule-zips
          path: dist/*.zip
